// DotaCS test server settings (runs after the competitive mode config)
mp_autokick 0                     // don't kick idle players
mp_autoteambalance 0
mp_limitteams 0
mp_humanteam ct                   // you play CT, Dota heroes are T bots
mp_warmup_pausetimer 1            // endless warmup
mp_ignore_round_win_conditions 1  // round never ends
mp_roundtime 60
mp_freezetime 0
mp_respawn_on_death_ct 1          // instant respawn
mp_respawn_on_death_t 1
sv_hibernate_when_empty 0         // keep running with no players
bot_quota 0                       // bots are only Dota heroes, the plugin adds them
bot_quota_mode normal
bot_stop 1                        // hero bots stand still, the plugin moves them
