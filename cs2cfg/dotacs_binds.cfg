// DotaCS: test and filming binds. Loaded automatically by START_ALL.bat
// keep the game running full speed and with sound when it is in the background (for side by side recording)
engine_no_focus_sleep 0
snd_mute_losefocus 0

// buying (works anywhere in test mode)
bind "F1" "buy ak47; buy vesthelm"
bind "F2" "buy awp; buy vesthelm"
bind "F3" "buy hegrenade; buy flashbang; buy smokegrenade; buy molotov"
bind "F4" "buy deagle"
bind "F5" "buy m4a1_silencer; buy vesthelm"

// test helpers (need sv_cheats, the server turns it on)
bind "v" "noclip"
bind "n" "give weapon_hegrenade"
bind "l" "kill"
bind "k" "connect 127.0.0.1:27030"

// filming
bind "h" "toggle cl_drawhud 0 1"
bind "j" "toggle r_drawviewmodel 0 1"
bind "o" "toggle cl_draw_only_deathnotices 0 1"

// third person on/off (F6), needs sv_cheats which the DotaCS server turns on
alias "dotacs_tp_on" "thirdperson; bind F6 dotacs_tp_off"
alias "dotacs_tp_off" "firstperson; bind F6 dotacs_tp_on"
bind "F6" "dotacs_tp_on"

// Dota things for the CS player: teleport, buyback, salve, ward, info
bind "F7" "css_tp top"
bind "F8" "css_tp mid"
bind "F9" "css_tp bot"
bind "F10" "css_tp base"
bind "F11" "css_bb"
bind "7" "css_salve"
bind "8" "css_ward"
bind "9" "css_inv"

// jump on mouse wheel too
bind "mwheeldown" "+jump"

echo "DotaCS binds loaded: F1 AK, F2 AWP, F3 nades, F4 deagle, F5 M4, V noclip, N HE, L kill, K reconnect, H hud, J gun model, O clean hud, F6 third person, F7-F10 teleport, F11 buyback, 7 salve, 8 ward, 9 info. Type !faq in chat"
